<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 600" width="1024" height="1200">
 <defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#1b2658"/><stop offset=".6" stop-color="#0c1230"/><stop offset="1" stop-color="#05081a"/></radialGradient>
  <linearGradient id="a" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#a9c2ff"/><stop offset="1" stop-color="#5f6dff"/></linearGradient>
  <linearGradient id="bladeGrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff3d6e"/><stop offset=".6" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
  <linearGradient id="orb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f7dff" stop-opacity="0"/><stop offset=".35" stop-color="#7fa2ff"/><stop offset="1" stop-color="#e8f0ff"/></linearGradient>
  <path id="A" d="M236 52H276L420 448H346L257.7 196L166 448H92Z"/>
  <path id="bladeShape" d="M128 392L352 300L362 324L184 384Z"/>
  <mask id="orbitMask" maskUnits="userSpaceOnUse" x="-50" y="-50" width="620" height="700"><rect x="-50" y="-50" width="620" height="700" fill="#fff"/>
    <use href="#A" fill="#000" stroke="#000" stroke-width="30" stroke-linejoin="miter"/><use href="#bladeShape" fill="#000" stroke="#000" stroke-width="24"/></mask>
  <mask id="legMask" maskUnits="userSpaceOnUse" x="-50" y="-50" width="620" height="700"><rect x="-50" y="-50" width="620" height="700" fill="#fff"/><use href="#bladeShape" fill="#000" stroke="#000" stroke-width="16" stroke-linejoin="miter"/></mask>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  <clipPath id="round"><rect width="512" height="600" rx="64"/></clipPath>
 </defs>
 <g clip-path="url(#round)">
  <rect width="512" height="600" fill="url(#bg)"/>
  <g fill="#fff"><circle cx="60" cy="70" r="1.6" opacity=".8"/><circle cx="450" cy="52" r="2" opacity=".9"/><circle cx="96" cy="300" r="1.3" opacity=".6"/><circle cx="470" cy="330" r="1.6" opacity=".7"/><circle cx="410" cy="150" r="1.2" opacity=".6"/><circle cx="40" cy="190" r="1.8" opacity=".7"/><circle cx="140" cy="40" r="1.2" opacity=".5"/><circle cx="486" cy="470" r="1.3" opacity=".6"/><circle cx="30" cy="430" r="1.4" opacity=".6"/></g>
  <g transform="translate(15 10) scale(0.94)">
   <!-- orbit, passes behind the A -->
   <g transform="rotate(-20 256 270)" mask="url(#orbitMask)">
    <ellipse cx="256" cy="270" rx="240" ry="72" fill="none" stroke="url(#orb)" stroke-width="7"/>
    <ellipse cx="256" cy="270" rx="262" ry="84" fill="none" stroke="#7fa2ff" stroke-opacity=".28" stroke-width="2"/>
   </g>
   <g transform="rotate(-20 256 270)"><circle cx="496" cy="270" r="0"/></g>
   <!-- planet on the orbit -->
   <circle cx="476" cy="188" r="15" fill="#ffd166"/><circle cx="476" cy="188" r="15" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/><circle cx="470" cy="182" r="5" fill="#fff" opacity=".7"/>
   <!-- the A -->
   <g mask="url(#legMask)">
    <use href="#A" fill="url(#a)"/>
    <path d="M256 52H276L420 448H346L257.7 196Z" fill="#3946c9" opacity=".32"/>
    <path d="M236 52H256L257.7 196L166 448H150Z" fill="#fff" opacity=".18"/>
   </g>
   <!-- blade: the motion cut -->
   <path d="M120 372L180 352L190 386L108 412Z" fill="#ff8a3d" opacity=".0"/>
   <g filter="url(#glow)" opacity=".55"><use href="#bladeShape" fill="url(#bladeGrad)"/></g>
   <use href="#bladeShape" fill="url(#bladeGrad)"/>
   <path d="M52 392L92 376M60 410L108 391M40 426L78 411" stroke="#ff8a3d" stroke-width="4" stroke-linecap="round" opacity=".75"/>
   <!-- four-point guiding star above the apex -->
   <path d="M372 40L377 66L403 72L377 78L372 104L367 78L341 72L367 66Z" fill="#fff"/>
   <circle cx="372" cy="72" r="24" fill="#9db8ff" opacity=".18" filter="url(#glow)"/>
  </g>
  <text x="256" y="548" text-anchor="middle" font-family="'Montserrat','Poppins','DejaVu Sans',Arial,sans-serif" font-weight="700" font-size="46" letter-spacing="22" fill="#e8eeff" dx="11">AXIOM</text>
  <text x="256" y="574" text-anchor="middle" font-family="'DejaVu Sans',Arial,sans-serif" font-size="10.5" letter-spacing="7" fill="#7f93d9" dx="3.5">SYSTEM</text>
 </g>
</svg>
